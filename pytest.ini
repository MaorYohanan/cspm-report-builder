[pytest]
testpaths = tests
# Default run = everything except the slow real-browser tests (~90s of the ~195s full suite).
# Run them with:  python -m pytest -m browser     (or all:  python -m pytest -m "")
addopts = -m "not browser" -p no:cacheprovider
markers =
    browser: drives real Edge via Playwright against a temp copy of the app (slow, needs free ports 8765/8766)
    node: shells out to node per test (~1-2s each on Windows)

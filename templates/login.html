<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wizi — כניסה למערכת</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      background: #0a0b0e;
      color: #e8eaed;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .login-card {
      background: #13151a;
      border: 1px solid #2a2d35;
      border-radius: 16px;
      padding: 48px 40px;
      width: 380px;
      text-align: center;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
    }

    .brand {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      margin-bottom: 32px;
    }

    .brand-logo {
      width: 44px;
      height: 44px;
      background: linear-gradient(135deg, #4f8ef7, #7c5cf8);
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      font-weight: 700;
      color: #fff;
    }

    .brand-text { text-align: right; }
    .brand-name { font-size: 22px; font-weight: 700; color: #e8eaed; }
    .brand-sub { font-size: 11px; color: #7a8499; letter-spacing: 2px; }

    h1 { font-size: 18px; font-weight: 600; margin-bottom: 8px; color: #e8eaed; }
    .subtitle { font-size: 14px; color: #7a8499; margin-bottom: 36px; line-height: 1.5; }

    .google-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      background: #fff;
      color: #3c4043;
      border: none;
      border-radius: 8px;
      padding: 12px 20px;
      font-size: 15px;
      font-weight: 500;
      width: 100%;
      cursor: pointer;
      text-decoration: none;
      transition: box-shadow 0.2s, background 0.2s;
      font-family: inherit;
    }

    .google-btn:hover { box-shadow: 0 2px 8px rgba(0,0,0,0.3); background: #f8f8f8; }

    .google-icon {
      width: 20px;
      height: 20px;
      flex-shrink: 0;
    }

    .divider {
      border: none;
      border-top: 1px solid #2a2d35;
      margin: 32px 0 20px;
    }

    .footer-note { font-size: 12px; color: #4a5568; line-height: 1.5; }
  </style>
</head>
<body>
  <div class="login-card">
    <div class="brand">
      <div class="brand-logo">W</div>
      <div class="brand-text">
        <div class="brand-name">Wizi</div>
        <div class="brand-sub">REPORTER</div>
      </div>
    </div>

    <h1>ברוך הבא</h1>
    <p class="subtitle">יש להתחבר עם חשבון Google ארגוני מורשה</p>

    <a href="/auth/login" class="google-btn">
      <svg class="google-icon" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
        <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
        <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
        <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z" fill="#FBBC05"/>
        <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
      </svg>
      התחבר עם Google
    </a>

    <hr class="divider">
    <p class="footer-note">הגישה למערכת מוגבלת לעובדי הארגון בלבד.<br>אין לך גישה? פנה למנהל המערכת.</p>
  </div>
</body>
</html>

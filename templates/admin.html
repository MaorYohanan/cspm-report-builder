<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wizi — ניהול משתמשים</title>
  <link rel="stylesheet" href="/static/css/builder.css?v=46">
  <style>
    body { padding: 0; }

    /* ── Top bar ── */
    .admin-topbar {
      height: var(--topbar-height);
      background: var(--sidebar-bg);
      border-bottom: 1px solid var(--sidebar-border);
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 0 24px;
      position: sticky;
      top: 0;
      z-index: 50;
    }

    .admin-logo {
      width: 28px;
      height: 28px;
      background: var(--accent);
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 13px;
      color: #fff;
      flex-shrink: 0;
    }

    .admin-topbar-title {
      font-size: 15px;
      font-weight: 700;
      color: var(--text-heading);
    }

    .back-btn {
      color: var(--text-muted);
      text-decoration: none;
      font-size: 13px;
      font-weight: 500;
      padding: 6px 14px;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      transition: color var(--transition), border-color var(--transition), background var(--transition);
    }
    .back-btn:hover {
      color: var(--text-heading);
      border-color: var(--border-hover);
      background: var(--bg-card);
    }

    /* ── Page body ── */
    .admin-body {
      max-width: 780px;
      margin: 0 auto;
      padding: 32px 24px;
    }

    /* ── Cards ── */
    .card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 24px;
      margin-bottom: 24px;
    }

    .card-title {
      font-size: 11px;
      font-weight: 700;
      color: var(--text-dim);
      text-transform: uppercase;
      letter-spacing: 0.6px;
      margin-bottom: 20px;
    }

    /* ── Add-user form ── */
    .add-form { display: flex; gap: 10px; align-items: flex-end; flex-wrap: wrap; }
    .form-group { display: flex; flex-direction: column; gap: 6px; flex: 1; min-width: 160px; }
    label { font-size: 12px; font-weight: 500; color: var(--text-dim); }

    input[type="email"], select {
      background: var(--bg-input);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      color: var(--text);
      padding: 8px 12px;
      font-size: 14px;
      font-family: inherit;
      outline: none;
      width: 100%;
      transition: border-color var(--transition);
    }
    input[type="email"]:focus, select:focus { border-color: var(--accent); }

    /* ── Buttons ── */
    .btn {
      padding: 9px 18px;
      border-radius: var(--radius);
      font-size: 14px;
      font-weight: 500;
      border: none;
      cursor: pointer;
      font-family: inherit;
      transition: opacity var(--transition);
      white-space: nowrap;
    }
    .btn:hover { opacity: 0.85; }
    .btn-primary { background: var(--accent); color: #fff; }
    .btn-danger  { background: var(--danger);  color: #fff; font-size: 12px; padding: 5px 12px; }

    /* ── Users table ── */
    table { width: 100%; border-collapse: collapse; }
    th, td { text-align: right; padding: 10px 14px; font-size: 14px; }
    th {
      color: var(--text-muted);
      font-weight: 600;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.4px;
      border-bottom: 1px solid var(--border);
    }
    td { border-bottom: 1px solid var(--border); }
    tr:last-child td { border-bottom: none; }
    tr:hover td { background: var(--bg-card-hover); }

    /* ── Role badges ── */
    .role-badge {
      display: inline-block;
      padding: 2px 10px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 600;
    }
    .role-admin  { background: oklch(0.28 0.12 280 / 0.45); color: oklch(0.75 0.16 280); }
    .role-editor { background: oklch(0.28 0.12 220 / 0.45); color: oklch(0.72 0.15 220); }
    .role-viewer { background: oklch(0.28 0.12 155 / 0.45); color: oklch(0.70 0.15 155); }

    /* ── Feedback messages ── */
    .msg-success { font-size: 13px; color: var(--success); margin-top: 10px; min-height: 18px; }
    .msg-error   { font-size: 13px; color: var(--danger);  margin-top: 10px; min-height: 18px; }

    .empty-state { text-align: center; padding: 40px; color: var(--text-muted); font-size: 14px; }
  </style>
</head>
<body>

  <div class="admin-topbar">
    <div class="admin-logo">W</div>
    <span class="admin-topbar-title">ניהול משתמשים</span>
    <div style="flex:1"></div>
    <a href="/" class="back-btn">→ חזרה לאפליקציה</a>
  </div>

  <div class="admin-body">

    <div class="card">
      <div class="card-title">הוספת משתמש חדש</div>
      <div class="add-form">
        <div class="form-group">
          <label for="new-email">כתובת אימייל</label>
          <input type="email" id="new-email" placeholder="user@company.com" autocomplete="off">
        </div>
        <div class="form-group" style="flex:0; min-width:130px;">
          <label for="new-role">תפקיד</label>
          <select id="new-role">
            <option value="viewer">Viewer</option>
            <option value="editor" selected>Editor</option>
            <option value="admin">Admin</option>
          </select>
        </div>
        <button class="btn btn-primary" onclick="addUser()">הוסף</button>
      </div>
      <div id="status-msg" class="msg-success"></div>
      <div id="error-msg"  class="msg-error"></div>
    </div>

    <div class="card">
      <div class="card-title">משתמשים קיימים</div>
      <div id="users-container">
        <div class="empty-state">טוען...</div>
      </div>
    </div>

  </div>

  <script>
    const ROLE_LABELS = { admin: 'Admin', editor: 'Editor', viewer: 'Viewer' };

    async function loadUsers() {
      const res = await fetch('/api/users');
      if (!res.ok) { document.getElementById('users-container').innerHTML = '<div class="empty-state">שגיאה בטעינת משתמשים</div>'; return; }
      const users = await res.json();
      renderUsers(users);
    }

    function renderUsers(users) {
      const el = document.getElementById('users-container');
      if (!users.length) { el.innerHTML = '<div class="empty-state">אין משתמשים עדיין</div>'; return; }
      const rows = users.map(u => `
        <tr>
          <td>${escHtml(u.email)}</td>
          <td><span class="role-badge role-${u.role}">${ROLE_LABELS[u.role] || u.role}</span></td>
          <td>
            <select data-uid="${u.id}" onchange="changeRole(this)">
              ${['viewer','editor','admin'].map(r => `<option value="${r}"${r===u.role?' selected':''}>${ROLE_LABELS[r]}</option>`).join('')}
            </select>
          </td>
          <td><button class="btn btn-danger" onclick="deleteUser(${u.id})">הסר</button></td>
        </tr>
      `).join('');
      el.innerHTML = `<table><thead><tr><th>אימייל</th><th>תפקיד</th><th>שינוי תפקיד</th><th>פעולות</th></tr></thead><tbody>${rows}</tbody></table>`;
    }

    function escHtml(s) { return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

    function setMsg(msg, isError) {
      document.getElementById('status-msg').textContent = isError ? '' : msg;
      document.getElementById('error-msg').textContent  = isError ? msg : '';
    }

    async function addUser() {
      const email = document.getElementById('new-email').value.trim();
      const role  = document.getElementById('new-role').value;
      if (!email) { setMsg('נא להזין כתובת אימייל', true); return; }
      const res = await fetch('/api/users', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({email, role})
      });
      const data = await res.json();
      if (!res.ok) { setMsg(data.error || 'שגיאה', true); return; }
      setMsg('המשתמש נוסף בהצלחה', false);
      document.getElementById('new-email').value = '';
      loadUsers();
    }

    async function changeRole(select) {
      const uid  = select.dataset.uid;
      const role = select.value;
      const res = await fetch(`/api/users/${uid}`, {
        method: 'PATCH',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({role})
      });
      const data = await res.json();
      if (!res.ok) { setMsg(data.error || 'שגיאה', true); loadUsers(); return; }
      setMsg('התפקיד עודכן', false);
    }

    async function deleteUser(uid) {
      if (!confirm('האם למחוק משתמש זה?')) return;
      const res  = await fetch(`/api/users/${uid}`, {method: 'DELETE'});
      const data = await res.json();
      if (!res.ok) { setMsg(data.error || 'שגיאה', true); return; }
      setMsg('המשתמש הוסר', false);
      loadUsers();
    }

    loadUsers();
  </script>

</body>
</html>

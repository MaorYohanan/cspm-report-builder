<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wizi — גישה נדחתה</title>
  <link rel="stylesheet" href="/static/css/auth.css">
  <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
</head>
<body>
  <div class="card">
    <div class="icon">🔒</div>
    <h1>גישה נדחתה</h1>
    <p class="message">{{ message }}</p>
    {% if request.args.get('reason') == 'forbidden' %}
    <a href="/" class="btn">חזרה לאפליקציה</a>
    {% else %}
    <a href="/auth/login" class="btn">חזרה לדף הכניסה</a>
    {% endif %}
  </div>
</body>
</html>

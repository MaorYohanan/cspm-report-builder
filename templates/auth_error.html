<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wizi — גישה נדחתה</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      background: #0a0b0e;
      color: #e8eaed;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .card {
      background: #13151a;
      border: 1px solid #3d1a1a;
      border-radius: 16px;
      padding: 48px 40px;
      width: 400px;
      text-align: center;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
    }

    .icon {
      font-size: 48px;
      margin-bottom: 20px;
    }

    h1 { font-size: 20px; font-weight: 700; color: #f87171; margin-bottom: 12px; }

    .message {
      font-size: 15px;
      color: #a0aec0;
      line-height: 1.6;
      margin-bottom: 32px;
    }

    .btn {
      display: inline-block;
      background: #2a2d35;
      color: #e8eaed;
      border: 1px solid #3a3d45;
      border-radius: 8px;
      padding: 10px 24px;
      font-size: 14px;
      font-weight: 500;
      text-decoration: none;
      cursor: pointer;
      transition: background 0.2s;
      font-family: inherit;
    }
    .btn:hover { background: #3a3d45; }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">🔒</div>
    <h1>גישה נדחתה</h1>
    <p class="message">{{ message }}</p>
    {% if request.args.get('reason') == 'forbidden' %}
    <a href="/" class="btn">חזרה לאפליקציה</a>
    {% else %}
    <a href="/auth/login" class="btn">חזרה לדף הכניסה</a>
    {% endif %}
  </div>
</body>
</html>
